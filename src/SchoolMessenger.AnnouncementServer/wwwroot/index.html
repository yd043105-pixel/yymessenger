<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여양고 · 학교 소식</title><link rel="stylesheet" href="portal.css"><script src="portal.js" defer></script></head>
<body><header><a class="brand" href="/"><b class="mark">여</b><span>여양고등학교<small>함께 여는 학교 소식</small></span></a><button id="logout" hidden>로그아웃</button></header><main>
<section id="login"><p class="eyebrow">학교에서 전하는 이야기</p><h1>우리 학교 소식</h1><p>학교에서 발급한 계정으로 가정통신문과 공지를 확인하세요.</p><form id="login-form"><label>아이디<input name="username" autocomplete="username" required maxlength="32"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><label class="check"><input name="rememberLogin" type="checkbox">자동 로그인</label><button class="primary">로그인</button></form><details><summary>학교 초대 코드로 가입하기</summary><form id="register-form"><label>초대 코드<input name="code" required autocomplete="off"></label><label>새 아이디<input name="username" required minlength="3" maxlength="32" autocomplete="username"></label><label>새 비밀번호<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><p>이름·역할·자녀 연결은 학교에서 확인합니다.</p><button>계정 등록</button></form></details></section>
<section id="workspace" hidden><div class="heading"><div><p class="eyebrow" id="identity"></p><h1 id="title">학교 소식</h1></div><button id="refresh">새로고침</button></div><div id="admin" hidden><nav><button data-panel="people">계정·초대</button><button data-panel="classes">학급</button><button data-panel="families">보호자 연결</button><button data-panel="status">연결 상태</button></nav><div id="admin-content"></div></div><section id="news" hidden><div class="filters"><label>자녀<select id="child"><option value="">전체 자녀</option></select></label><label class="check"><input type="checkbox" id="unread">미확인만</label></div><div class="columns"><div id="list"></div><article id="detail"><p>공지를 선택하세요.</p></article></div><button id="more" hidden>다음 목록</button></section></section>
</main><p id="feedback" role="status" aria-live="polite"></p><dialog id="confirm"><form method="dialog"><h2>변경 내용을 확인하세요</h2><p id="confirm-text"></p><div class="actions"><button value="cancel">취소</button><button value="ok" class="primary">변경하기</button></div></form></dialog></body></html>

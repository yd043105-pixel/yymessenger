name: Native Mac
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['src/SchoolMessenger.Mac/**', 'src/SchoolMessenger.Mobile/**', 'src/SchoolMessenger.Shared/**', 'src/SchoolMessenger.Contracts/**', 'tests/mac-*', 'tests/MacRuntimeChecks.cs', 'scripts/Build-Mac.sh', '.github/workflows/mac.yml', 'Directory.Build.props']
permissions:
  contents: read
concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install pinned Apple workload
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          dotnet workload install maui-maccatalyst --version 10.0.401
      - name: Restore native Mac dependencies
        run: |
          if [[ -f src/SchoolMessenger.Mac/packages.lock.json ]]; then
            dotnet restore src/SchoolMessenger.Mac --locked-mode
          else
            dotnet restore src/SchoolMessenger.Mac
          fi
      - name: Build native verification app and synthetic servers
        run: |
          runtime=maccatalyst-x64
          [[ "$(uname -m)" != arm64 ]] || runtime=maccatalyst-arm64
          dotnet build src/SchoolMessenger.Mac -c Debug -r "$runtime" --no-restore -p:MacVerification=true -p:CodesignKey=- -p:CodesignRequireProvisioningProfile=false
          dotnet build src/SchoolMessenger.Server -p:RestoreLockedMode=true
          dotnet build src/SchoolMessenger.AnnouncementServer -p:RestoreLockedMode=true
      - name: Run actual native Mac client
        run: node tests/mac-runtime.mjs
      - name: Publish Apple Silicon and Intel trial applications
        run: |
          bash scripts/Build-Mac.sh maccatalyst-arm64
          bash scripts/Build-Mac.sh maccatalyst-x64
      - name: Save actual applications and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-1.0.0-trial
          path: |
            artifacts/mac/
            src/SchoolMessenger.Mac/packages.lock.json
          retention-days: 7
          if-no-files-found: error

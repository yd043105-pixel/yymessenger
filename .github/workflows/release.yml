name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Build and verify release
        shell: powershell
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          ./scripts/Build.ps1 -HeadlessTests -Version $releaseVersion
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          node tests/smoke.mjs --features --package
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - name: Create release draft
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          $releaseArguments = @('release', 'create', $env:GITHUB_REF_NAME,
            "artifacts/yymessenger-$releaseVersion-win-x64.zip", 'artifacts/SHA256SUMS.txt',
            '--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--draft',
            '--title', "yymessenger $releaseVersion", '--notes-file', 'docs/release-notes.md')
          if ($releaseVersion.Contains('-')) { $releaseArguments += '--prerelease' }
          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }

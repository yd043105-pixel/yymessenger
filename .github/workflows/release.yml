name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build and verify release
        shell: powershell
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          ./scripts/Build.ps1 -HeadlessTests -Version $releaseVersion
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          node tests/smoke.mjs --features --package
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - name: Create release draft
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          $releaseArguments = @('release', 'create', $env:GITHUB_REF_NAME,
            "artifacts/yymessenger-$releaseVersion-win-x64.zip", 'artifacts/SHA256SUMS.txt',
            '--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--draft',
            '--title', "yymessenger $releaseVersion", '--notes-file', 'docs/release-notes.md')
          if ($releaseVersion.Contains('-')) { $releaseArguments += '--prerelease' }
          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }

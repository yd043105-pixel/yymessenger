name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build and verify release
        shell: powershell
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          node tests/release-policy.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release policy verification failed' }
          ./scripts/Build.ps1 -HeadlessTests -Version $releaseVersion
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          node tests/smoke.mjs --features --package
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - name: Build and verify Windows installer
        shell: pwsh
        run: |
          ./scripts/Build-Installer.ps1 -ClientDirectory (Join-Path $PWD 'artifacts/여양고-교무메신저/client')
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          ./tests/installer.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer verification failed' }
          ./scripts/Build-ServerInstaller.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Server installer build failed' }
          ./tests/server-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Server installer verification failed' }
      - name: Create release according to school policy
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          $policy = Get-Content config/maintenance-release.json -Raw | ConvertFrom-Json
          $initialPath = Join-Path $env:RUNNER_TEMP 'yy-initial-release.json'
          $modeArguments = @('scripts/Release-Policy.mjs', $releaseVersion)
          if ($policy.firstReleaseApproved -eq $true -and $policy.automaticPublicReleasesAfterLaunch -eq $true) {
            $initial = & gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,publishedAt
            if ($LASTEXITCODE -eq 0) {
              Set-Content -LiteralPath $initialPath -Value $initial -Encoding utf8
              $modeArguments += $initialPath
            }
          }
          $releaseMode = & node @modeArguments
          if ($LASTEXITCODE -ne 0 -or $releaseMode -notin @('draft','public')) { throw 'Release policy check failed' }
          $releaseArguments = @('release', 'create', $env:GITHUB_REF_NAME,
            "artifacts/yymessenger-$releaseVersion-win-x64.zip", 'artifacts/SHA256SUMS.txt',
            "artifacts/yymessenger-$releaseVersion-servers-win-x64.zip",
            "artifacts/yymessenger-$releaseVersion-server-setup-win-x64.exe",
            "artifacts/yymessenger-$releaseVersion-setup-win-x64.exe",
            '--repo', $env:GITHUB_REPOSITORY, '--verify-tag',
            '--title', "yymessenger $releaseVersion", '--notes-file', 'docs/release-notes.md')
          if ($releaseMode -eq 'draft') { $releaseArguments += '--draft' }
          if ($releaseVersion.Contains('-')) { $releaseArguments += '--prerelease' }
          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
